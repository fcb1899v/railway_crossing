name: railroad_crossing
description: railroad crossing simulator
publish_to: 'none'
version: 1.4.5+53

environment:
  # 3.47 is the floor, not 3.3: Android Gradle Plugin 9 rejects the Kotlin
  # Gradle Plugin being applied on top, and Flutter forces it onto plugin
  # modules until 3.47 adds the isBuiltInKotlinEnabled guard. Declaring 3.3
  # let `pub get` succeed and the Android build fail later with an error
  # that names neither.
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter_android: ^4.14.1
  webview_flutter: ^4.14.1
  # Firebase
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  firebase_app_check: ^0.4.7
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.4.0
  # App Icon
  cupertino_icons: ^1.0.9
  flutter_launcher_icons: ^0.14.4
  # Audio Player
  just_audio: ^0.10.6
  path: ^1.9.1
  # Vibration
  vibration: ^3.2.1
  # SharedPreference
  shared_preferences: ^2.5.5
  # Floating Button
  fab_circular_menu_plus: ^0.0.4
  # Admob
  # 8+ adds Swift Package Manager support (required for hybrid SPM with webview).
  google_mobile_ads: ^9.1.0
  # Device locale (0.9+ has iOS SPM support)
  devicelocale: ^0.9.1
  # OS version
  device_info_plus: ^13.2.0
  # Game Center / Play Games (ticket sync identity)
  games_services: ^5.3.0
  #env
  flutter_dotenv: ^6.0.1
  # Revenue Cat
  purchases_flutter: ^10.11.0
  # HyperLink
  url_launcher: ^6.3.2
  # Launches raw URL strings; Uri.parse lowercases schemes like App-prefs:
  url_launcher_platform_interface: ^2.3.2
  #MVVM
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1
  # Networking (sharing / gallery helpers)
  http: ^1.6.0
  #Server Time
  ntp: ^2.0.0
  #Save Image
  # 13+ pulls permission_handler_apple with iOS SPM support
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  image_gallery_saver_plus: ^5.1.1
  share_plus: ^13.3.0
  # App Splash (runtime API used in main/homepage)
  flutter_native_splash: ^2.4.8

  # Localize
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  image_path: "assets/icon/appIcon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter_native_splash:
  image: "assets/icon/icon.png"
  color: "#ffffff"
  android_12:
    image: "assets/icon/icon.png"
    icon_background_color: "#ffffff"
  ios: true
  web: false

flutter:
  generate: true
  uses-material-design: true
  config:
    # All current iOS plugins support SPM; CocoaPods has been removed.
    enable-swift-package-manager: true
  assets:
    - assets/icon/
    - assets/images/
    - assets/images/flag/
    - assets/images/crossing/
    - assets/images/crossing/jp/
    - assets/images/crossing/uk/
    - assets/images/crossing/cn/
    - assets/images/crossing/us/
    - assets/images/train/jp/
    - assets/images/train/uk/
    - assets/images/train/cn/
    - assets/images/train/us/
    - assets/audios/
    - assets/audios/jp/
    - assets/audios/uk/
    - assets/audios/cn/
    - assets/audios/us/
    - assets/fonts/
    - assets/.env
    - assets/

  fonts:
    - family: beon
      fonts:
        - asset: assets/fonts/beon.ttf
