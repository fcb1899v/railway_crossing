plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}
//apply plugin: 'kotlin-parcelize'

// kotlin-stdlib comes from AGP 9 built in Kotlin; no version pinned here
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing reads a file outside the repository, and only when a release output is requested.
def releaseSigningTasks = ['assembleRelease', 'bundleRelease', ':app:assembleRelease', ':app:bundleRelease']
def releaseSigningRequested = gradle.startParameter.taskNames.any { it in releaseSigningTasks }
def keyPropertiesPath = System.getenv('ANDROID_KEY_PROPERTIES') ?: "${System.getProperty('user.home')}/key/keystore/key.properties"
def keystoreProperties = new java.util.Properties()
if (releaseSigningRequested) {
    try {
        new File(keyPropertiesPath).withReader('UTF-8') { keystoreProperties.load(it) }
    } catch (IOException e) {
        throw new GradleException("Release signing: cannot read ${keyPropertiesPath} (${e.message}). Create it from android/key.properties.example, or point ANDROID_KEY_PROPERTIES at it.")
    }
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { !keystoreProperties.getProperty(it) }
    if (missing) {
        throw new GradleException("Release signing: ${keyPropertiesPath} has no ${missing.join(', ')}.")
    }
    if (!new File(keystoreProperties.getProperty('storeFile')).isAbsolute()) {
        throw new GradleException("Release signing: storeFile in ${keyPropertiesPath} must be an absolute path.")
    }
}

android {

    // compileSdk and targetSdk are written out, not taken from flutter.*.
    // The flutter.* default is still 36 and would move this app back a level.
    compileSdkVersion 37
    // NDK r28+ aligns native libs for 16 KB page-size devices by default
    ndkVersion flutter.ndkVersion   // 28.2.13676358 in Flutter 3.47.2
    namespace "nakajimamasao.appstudio.railwaycrossing"

    kotlinOptions {
        jvmTarget = "17"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "nakajimamasao.appstudio.railwaycrossing"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 37
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (releaseSigningRequested) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile new File(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    // Keep .so uncompressed so 16 KB ZIP/ELF alignment is preserved (AGP 8.5+)
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
}

// A release built under any other task name (an abbreviation such as bR, or Android Studio) would skip the key file above.
def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    def requested = releaseSigningRequested
    doLast {
        if (!requested) {
            throw new GradleException('Release signing: run assembleRelease or bundleRelease by its full name so the key file is read.')
        }
    }
}
tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach { dependsOn verifyReleaseSigning }

// Release builds read the production ad unit ids from assets/.env, so a missing, malformed or Google demo id stops them here.
// Debug-only App Check values must never ride along in a release, neither as a define nor in assets/.env.
def requiredReleaseEnvKeys = ['ANDROID_BANNER_UNIT_ID']
def releaseEnvFile = rootProject.file('../assets/.env')
def verifyReleaseConfig = tasks.register('verifyReleaseConfig') {
    def encoded = (project.findProperty('dart-defines') ?: '').toString()
    doLast {
        def lines
        try {
            lines = releaseEnvFile.readLines('UTF-8')
        } catch (IOException e) {
            throw new GradleException("Release: cannot read assets/.env (${e.message}). Copy assets/.env_example to assets/.env and fill it in.")
        }
        // The first line for a key wins, as in flutter_dotenv; a trailing comment and surrounding quotes are dropped.
        def env = [:]
        lines.each { line ->
            def m = line =~ /^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=(.*)$/
            if (m.find() && !env.containsKey(m.group(1))) {
                env[m.group(1)] = m.group(2).replaceFirst(/#.*/, '').trim().replaceFirst(/^(["'])(.*)\1$/, '$2')
            }
        }
        // Key names only in the messages: the values stay out of build logs.
        def bad = requiredReleaseEnvKeys.findAll { key ->
            def value = env[key] ?: ''
            !(value ==~ /ca-app-pub-[0-9]+\/[0-9]+/) || value.startsWith('ca-app-pub-3940256099942544/')
        }
        if (bad) {
            throw new GradleException("Release: assets/.env has no production ad unit id in ${bad.join(', ')} (missing, malformed or a Google demo unit).")
        }
        def envDebugOnly = env.keySet().findAll { it.startsWith('APPCHECK_') }
        if (envDebugOnly) {
            throw new GradleException("Release: ${envDebugOnly.join(', ')} is debug-only and must not be in assets/.env, which ships inside the app.")
        }
        def values = encoded.split(',').findAll { it }.collect { new String(it.decodeBase64(), 'UTF-8') }
            .collectEntries { def i = it.indexOf('='); i < 0 ? [:] : [(it.substring(0, i)): it.substring(i + 1)] }
        def debugOnly = values.keySet().findAll { it.startsWith('APPCHECK_') }
        if (debugOnly) {
            throw new GradleException("Release: ${debugOnly.join(', ')} is debug-only and must not be passed to a release build.")
        }
    }
}
tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach { dependsOn verifyReleaseConfig }

flutter {
    source '../..'
}

// Exclude deprecated play-services-safetynet; use Play Integrity API instead

configurations.all {
    // No safetynet exclude: that module is not in the 19.x App Check POM at all.
    // shared_preferences resolves datastore to 1.1.7 with or without this force and ELF analysis found no defect there; keep the force unless the dependency graph changes, or re-verify at the ELF level before removing it.
    resolutionStrategy {
        force 'androidx.datastore:datastore:1.2.1'
        force 'androidx.datastore:datastore-android:1.2.1'
        force 'androidx.datastore:datastore-core:1.2.1'
        force 'androidx.datastore:datastore-core-android:1.2.1'
        force 'androidx.datastore:datastore-preferences:1.2.1'
        force 'androidx.datastore:datastore-preferences-android:1.2.1'
        force 'androidx.datastore:datastore-preferences-core:1.2.1'
        force 'androidx.datastore:datastore-preferences-core-android:1.2.1'
    }
}

dependencies {
    implementation "androidx.core:core:1.19.0"
    implementation 'com.google.android.play:integrity:1.6.0'
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}
