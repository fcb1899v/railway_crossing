plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}
//apply plugin: 'kotlin-parcelize'

// kotlin-stdlib comes from AGP 9 built in Kotlin; no version pinned here
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {

    // compileSdk and targetSdk are written out, not taken from flutter.*.
    // The flutter.* default is still 36 and would move this app back a level.
    compileSdkVersion 37
    // NDK r28+ aligns native libs for 16 KB page-size devices by default
    ndkVersion flutter.ndkVersion   // 28.2.13676358 in Flutter 3.47.2
    namespace "nakajimamasao.appstudio.railwaycrossing"

    kotlinOptions {
        jvmTarget = "17"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "nakajimamasao.appstudio.railwaycrossing"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 37
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    // Keep .so uncompressed so 16 KB ZIP/ELF alignment is preserved (AGP 8.5+)
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
}

flutter {
    source '../..'
}

// Exclude deprecated play-services-safetynet; use Play Integrity API instead

configurations.all {
    // No safetynet exclude: that module is not in the 19.x App Check POM at all.
    // shared_preferences pulls datastore 1.2.0 whose .so fails 16KB RELRO, so force 1.2.1.
    resolutionStrategy {
        force 'androidx.datastore:datastore:1.2.1'
        force 'androidx.datastore:datastore-android:1.2.1'
        force 'androidx.datastore:datastore-core:1.2.1'
        force 'androidx.datastore:datastore-core-android:1.2.1'
        force 'androidx.datastore:datastore-preferences:1.2.1'
        force 'androidx.datastore:datastore-preferences-android:1.2.1'
        force 'androidx.datastore:datastore-preferences-core:1.2.1'
        force 'androidx.datastore:datastore-preferences-core-android:1.2.1'
    }
}

dependencies {
    implementation "androidx.core:core:1.19.0"
    implementation 'com.google.android.play:integrity:1.6.0'
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}
